name: FC27 Spieler aktualisieren V1

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: write

concurrency:
  group: fc27-player-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: FC27-Werte aktualisieren
        run: python update_players.py

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.json competitions.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "FC27 Spieler automatisch aktualisieren"
            git push
          fi
